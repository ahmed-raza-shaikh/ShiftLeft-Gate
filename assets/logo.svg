<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ShiftLeft Gate logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13243b"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- gate posts -->
  <rect x="30" y="26" width="10" height="70" rx="4" fill="url(#accent)"/>
  <rect x="80" y="26" width="10" height="70" rx="4" fill="url(#accent)"/>
  <!-- gate bar, lowered to block -->
  <rect x="26" y="52" width="68" height="10" rx="4" fill="#e6edf3"/>
  <!-- critical stop dot -->
  <circle cx="60" cy="90" r="7" fill="#f87171"/>
</svg>
